# tech-design §15「发布与分发」: a v* tag builds the four binaries, the
# archives, checksums.txt and the changelog of the GitHub Release
# (.github/workflows/release.yml). OSS GoReleaser only.
version: 2
project_name: sqlmux

git:
  ignore_tags: ["m*"] # a milestone's tag is no release: the changelog goes back to the last v*

builds:
  - id: sqlmux
    main: ./cmd/sqlmux
    binary: sqlmux # goreleaser's own suffix on windows is .exe
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    name_template: "sqlmux_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides: # a windows archive is a zip, what Explorer opens (§15)
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^e2e:", "^prune:", "^Merge "]
  groups:
    - title: Features
      regexp: '^F\d+\.\d+'
      order: 0
    - title: Others
      order: 1

release:
  draft: false
