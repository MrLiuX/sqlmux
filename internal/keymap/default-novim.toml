# The keys vim = false adds over default.toml (tech-design §6.9): the grid
# PgUp / PgDn and Delete, and a query runs on C-e as its ↵ is a new line. The
# arrow keys of the grid and the tree are in default.toml since F16.6. Unlike
# default.toml this file may use PgUp, PgDn and Delete: they are what someone
# who does not use vim has to hand (§6.2).

[keys.grid]
"<PageDown>" = "grid.page.next"
"<PageUp>" = "grid.page.prev"
"<Del>" = "grid.row.delete"

[keys.query]
"<CR>" = "" # a new line, the editor's
"<C-e>" = "query.run"
