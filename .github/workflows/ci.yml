# tech-design §15「CI」: lint, vet and unit tests, and the integration tests
# on PG 17 and MySQL 8.4 with testdata/seed loaded. e2e is not run here: it
# needs a terminal and tmux (AGENTS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0 # the same as the justfile's
          install-mode: goinstall # built with setup-go's Go, which go.mod's version needs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test ./...
      - name: the benchmarks run (a go test without -bench only compiles them)
        run: go test -run '^$' -bench . -benchtime 1x ./internal/app/
      - name: gofmt and go mod tidy leave nothing to change
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go mod tidy
          git diff --exit-code go.mod go.sum

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sqlmux
          POSTGRES_PASSWORD: sqlmux
          POSTGRES_DB: sqlmux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sqlmux -d sqlmux"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlmux
          MYSQL_USER: sqlmux
          MYSQL_PASSWORD: sqlmux
          MYSQL_DATABASE: sqlmux
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usqlmux -psqlmux"
          --health-interval 2s --health-retries 30
    env:
      SQLMUX_TEST_PG: postgres://sqlmux:sqlmux@localhost:5432/sqlmux?sslmode=disable
      SQLMUX_TEST_MYSQL: sqlmux:sqlmux@tcp(localhost:3306)/sqlmux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # docker-compose.yml mounts the seeds into the images' init directory;
      # a service container cannot, so they are loaded here, the MySQL one as
      # root as the image would
      - name: load the seeds
        run: |
          PGPASSWORD=sqlmux psql -h localhost -U sqlmux -d sqlmux -v ON_ERROR_STOP=1 -f testdata/seed/pg.sql
          mysql -h 127.0.0.1 -uroot -psqlmux sqlmux < testdata/seed/mysql.sql
      - run: go test -tags integration ./...
