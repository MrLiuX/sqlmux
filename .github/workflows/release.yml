# tech-design §15「发布与分发」: a v* tag runs ci.yml's checks, then GoReleaser
# (.goreleaser.yaml) builds the archives and makes the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the Release and its files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog reads the commits since the last tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the formula of kackerx/homebrew-tap is made from this tag's source and
  # committed there (TAP_GITHUB_TOKEN: a token that can push to that repo)
  tap:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: kackerx/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: write and push Formula/sqlmux.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL "https://github.com/kackerx/sqlmux/archive/refs/tags/$TAG.tar.gz" -o source.tar.gz
          mkdir -p tap/Formula
          sh src/.github/scripts/tap-formula.sh "$TAG" "$(sha256sum source.tar.gz | cut -d' ' -f1)" > tap/Formula/sqlmux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sqlmux.rb
          git diff --cached --quiet && exit 0
          git commit -m "sqlmux $TAG"
          git push
