# tech-design §15「发布与分发」: a v* tag runs ci.yml's checks, then GoReleaser
# (.goreleaser.yaml) builds the archives and makes the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the Release and its files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog reads the commits since the last tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
