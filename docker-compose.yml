# Databases for the integration tests and e2e (tech-design §15). Ports stay
# off the local defaults so a developer's own PG / MySQL keeps running.
#   docker compose up -d --wait
#   SQLMUX_TEST_PG='postgres://sqlmux:sqlmux@localhost:55432/sqlmux?sslmode=disable' \
#   SQLMUX_TEST_MYSQL='sqlmux:sqlmux@tcp(localhost:53306)/sqlmux' go test -tags integration ./...
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sqlmux
      POSTGRES_PASSWORD: sqlmux
      POSTGRES_DB: sqlmux
    ports: ["55432:5432"]
    volumes: ["./testdata/seed/pg.sql:/docker-entrypoint-initdb.d/pg.sql:ro"]
    healthcheck:
      # over TCP: while the seed runs, the image's init server only listens on the socket
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sqlmux", "-d", "sqlmux"]
      interval: 1s
      retries: 30

  mysql: # M5
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqlmux
      MYSQL_USER: sqlmux
      MYSQL_PASSWORD: sqlmux
      MYSQL_DATABASE: sqlmux
    ports: ["53306:3306"]
    volumes: ["./testdata/seed/mysql.sql:/docker-entrypoint-initdb.d/mysql.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usqlmux", "-psqlmux"]
      interval: 2s
      retries: 30

  # M16: redis-stack-server has RedisJSON. testdata/seed/redis.txt is db0 (one of
  # each type, a namespace tree, a hash of 6000 fields, 12000 keys) and db1 (two
  # keys), a command a line, loaded by redis-seed once: its JSON.SET fails
  # on a server with no RedisJSON. A TTL in it is ten years.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  redis-seed: # once: a data volume that has the seed already is left alone
    image: redis/redis-stack-server:7.4.0-v3
    depends_on:
      redis: {condition: service_healthy}
    volumes: ["./testdata/seed/redis.txt:/seed/redis.txt:ro"]
    entrypoint: ["sh", "-c", "[ \"$$(redis-cli -h redis exists seed:done)\" = 1 ] || redis-cli -h redis < /seed/redis.txt"]
    restart: "no"
